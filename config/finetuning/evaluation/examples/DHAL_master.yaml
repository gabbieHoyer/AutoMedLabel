
# ------------------------ Evaluation ------------------------ #
evaluation:
  name: "DHAL_Shoulder"
  description: "Evaluating models finetuned on the DHAL shoulder MRI dataset."

SEED: 42
distributed: False  # single-gpu for evaluation

dataset:
  DHAL-cube:
    config: DHAL.yaml     
    project: DHAL-Evaluation

datamodule:
  max_subject_set: 10
  bbox_shift: 0
  batch_size: 1  
  num_workers: 1

  # ----- Custom Metric Evaluation ----- # 
  # metric:
  #   func:
  #     cartilagethickness: true
  #   tissues: [1, 2, 3, 4]    # oai 
  #   dicom_fields: ['pixel_spacing', 'slice_thickness', 'rows', 'columns']
  #   representative_slice: True

module:
  work_dir: "work_dir/evaluation"
  task_name: DHAL-Evaluation
  use_wandb: False #True
  visualize: True

output_configuration:
  save_path: Run_Summaries
  viz_eval_path: ${output_configuration.save_path}/figs
  summary_file: ${evaluation.name}_data_summary.csv
  logging_level: INFO 

obj_det:
  model_path: /path/to/AutoMedLabel2/work_dir/model_weights/finetuned/shoulder/best.pt
  model_weights: shouler_YOLO8_200epoch
  model_type: YOLO
  conf: 0.25
  post_processing: True

# -------------------- SAM2 Baseline Weight -------------------- #
base_model: "work_dir/model_weights/SAM2/sam2_hiera_base_plus.pt"
# base_model: "work_dir/model_weights/SAM2/sam2_hiera_tiny.pt"
# base_model: "work_dir/model_weights/SAM/sam_vit_b_01ec64.pth"

# -------------------- SAM Baseline Weight -------------------- #
# base_model: "work_dir/model_weights/SAM/sam_vit_b_01ec64.pth"

# -------------------- MedSAM Baseline Weight -------------------- #
# base_model: "work_dir/model_weights/MedSAM/medsam_vit_b.pth"

models:
  # --------------- Best Finetuned: No Bbox Shift aug -------------- #
  - finetuned_model: "/path/to/AutoMedLabel2/work_dir/finetuning/mskSAM/SAM2_full_trainSubjects_sliceBalance_False_imgEnc_True_maskDec_True/Run_9/20240819-1329_finetuned_model_best_converted.pth"
    model_identifier: mskSAM2_best_no_shift-bal_False-sub_set_full-bbox_shift_0
    pretrain_model: ${base_model}
    model_type: sam2_hiera_b+.yaml
    model_details:
      balanced: false
      subject: full
      bbox_shift: 0
    trainable:
      prompt_encoder: false
      image_encoder: true
      mask_decoder: true
      resize_masks: True  

# ------------------------------------------------------------------ #
# --------------- Best Finetuned: Bbox Shift aug ---------------- #
  - finetuned_model: "/path/to/AutoMedLabel2/work_dir/finetuning/DHAL-Shoulder/SAM2_full_trainSubjects_sliceBalance_False_imgEnc_True_maskDec_True/Run_2/20240816-1227_finetuned_model_best_converted.pth"
    model_identifier: DHAL_SAM2_best_shift-bal_False-sub_set_full-bbox_shift_5
    pretrain_model: "work_dir/model_weights/SAM2/sam2_hiera_base_plus.pt"
    model_type: sam2_hiera_b+.yaml
    model_details:
      balanced: false
      subject: full
      bbox_shift: 5
    trainable:
      prompt_encoder: false
      image_encoder: true
      mask_decoder: true
      resize_masks: True  

# ------------------------------------------------------------------ #
# ------------------------ SAM2 baseline -------------------------- #
  - finetuned_model: ""
    model_identifier: SAM2
    pretrain_model: "work_dir/model_weights/SAM2/sam2_hiera_base_plus.pt"
    model_type: sam2_hiera_b+.yaml
    model_details:
      balanced: false
      subject: 0
      bbox_shift: 0
    trainable:
      prompt_encoder: false
      image_encoder: true
      mask_decoder: true
      resize_masks: True  

# ------------------------------------------------------------------ #
# ------------------------- SAM baseline -------------------------- #
  - finetuned_model: ""
    model_identifier: SAM
    pretrain_model:: "work_dir/model_weights/SAM/sam_vit_b_01ec64.pth"
    model_type: vit_b
    model_details:
      balanced: false
      subject: 0
      bbox_shift: 0
    trainable:
      prompt_encoder: false
      image_encoder: true
      mask_decoder: true
      resize_masks: True
      
# ------------------------------------------------------------------ #
# ----------------------- MedSAM baseline -------------------------- #
  - finetuned_model: ""
    model_identifier: MedSAM
    pretrain_model: "work_dir/model_weights/MedSAM/medsam_vit_b.pth"
    model_type: vit_b
    model_details:
      balanced: false
      subject: 0
      bbox_shift: 0
    trainable:
      prompt_encoder: false
      image_encoder: true
      mask_decoder: true
      resize_masks: True  

