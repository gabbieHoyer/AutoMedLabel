
[project]
name = "automedlabel"
version = "0.1.0"
description = "A reproducible pipeline for evaluating foundation models in musculoskeletal MRI."
authors = [
    {name = "Gabrielle Hoyer", email = "gabbie.hoyer@ucsf.edu"}
]
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.10"

# Main dependencies 
dependencies = [
    "torch>=2.5.1",
    "pyrootutils",
    "numpy",
    "pillow (>=11.1.0,<12.0.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "hydra-core (>=1.3.2,<2.0.0)",
    "iopath (>=0.1.10,<0.2.0)",
    "monai (>=1.4.0,<2.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "scikit-image (>=0.25.2,<0.26.0)",
    "simpleitk (>=2.4.1,<3.0.0)",
    "nibabel (>=5.3.2,<6.0.0)",
    "scipy (>=1.15.2,<2.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "requests (>=2.32.3,<3.0.0)",
    "psutil (>=7.0.0,<8.0.0)",
    "py-cpuinfo (>=9.0.0,<10.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "ultralytics-thop (>=2.0.14,<3.0.0)",
]

# Optional extras ('stats' group):
# (Install them by running: poetry install --with stats)
[project.optional-dependencies]
stats = [
    "pandas",
    "scipy",
    "statsmodels"
]

[project.scripts]
automedlabel = "src.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
